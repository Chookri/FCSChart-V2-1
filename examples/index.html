            // searchAllowSymbols: ['BINANCE:BTCUSDT', 'ONA:EURUSD'],  // Only these symbols appear in results (null = all)
            // searchExcludeSymbols: ['BINANCE:DOGEUSDT'],     // Hide these symbols from results (null = none)
            searchModalTabs: {'fav':'Fav','all':'All List','forex':'Forex', 'crypto':'Crypto','stock':'Stocks','dr':'Drs', 'fund':'Funds', 'futures':'Future', 'indices':'Indicies','dex':'Dex'},  
            // ========================================
            // TOOLBAR  CONTROLS
            enableSearch: true,                   // Symbol search button
            enableIndicators: true,               // Indicators button and panel
            enableMultiChart: true,               // Multi-chart layouts button
            enableReplay: true,                   // Replay mode button and functionality
            enableCapture: true,                  // Screenshot/export button
            enableUndoRedo: true,                 // Undo/Redo buttons (Ctrl+Z, Ctrl+Y)
            enableTemplates: true,                // Template save/load functionality
            enableSettings: true,                 // Settings gear button
            enableSymbolInfo: true,               // Symbol info button (shows profile/stats)
            enableChartTypeSelector: true,        // Chart type dropdown selector
            enableTimeframeSelector: true,        // Timeframe/period dropdown selector
            displayExchangeName:true,               // when false: Hide exchange name from info overlay
            
            // ========================================
            // CHART FEATURES

            enableSocket: true,                   // WebSocket for live price updates
            enableContextMenu: true,              // Right-click context menu
            enableDrawingTools: true,             // Drawing tools functionality

            // ========================================

            // ========================================

            enableBidPriceLabels: true,           // Bid price label on price axis
            enableHighLowLabels: true,            // High/Low price labels on chart

            // ========================================

        // ============================================================
        // A / L are mutually exclusive when activating a scale mode.
        // Pressing the active button again leaves both modes inactive.
        // ============================================================
        let scaleModesLockedInactive = false;

        (function setupScaleModeButtonBehavior() {
            const autoBtn = chart && chart.priceScaleAutoBtn;
            const logBtn = chart && chart.priceScaleLogBtn;
            if (!autoBtn || !logBtn || chart.__tradigyScaleModeBound) return;

            function renderScaleModeButtons() {
                const autoActive = !scaleModesLockedInactive && !!chart.autoScale;
                const logActive = !scaleModesLockedInactive && !!chart.logScale;
                const toggleContainer = autoBtn.parentElement;

                if (toggleContainer) {
                    toggleContainer.classList.toggle(
                        'scale-modes-locked-inactive',
                        scaleModesLockedInactive
                    );
                }

                autoBtn.classList.toggle('active', autoActive);
                logBtn.classList.toggle('active', logActive);
                autoBtn.setAttribute('aria-pressed', autoActive ? 'true' : 'false');
                logBtn.setAttribute('aria-pressed', logActive ? 'true' : 'false');
            }

            function syncScaleModeState() {
                if (scaleModesLockedInactive) {
                    chart.autoScale = false;
                    chart.logScale = false;
                    renderScaleModeButtons();
                    return;
                }

                if (chart.logScale) {
                    chart.autoScale = false;
                } else if (chart.autoScale) {
                    chart.logScale = false;
                }

                renderScaleModeButtons();
            }

            function unlockScaleModesByUserClick() {
                scaleModesLockedInactive = false;
                setTimeout(syncScaleModeState, 0);
            }

            // Run after FCS's own click handler/UI-manager update has completed.
            autoBtn.addEventListener('click', unlockScaleModesByUserClick);
            logBtn.addEventListener('click', unlockScaleModesByUserClick);

            // FCS may touch the button classes again during its own UI update.
            // Keep the visible A/L state synchronized with the chart state.
            const scaleModeObserver = new MutationObserver(syncScaleModeState);
            scaleModeObserver.observe(autoBtn, { attributes: true, attributeFilter: ['class'] });
            scaleModeObserver.observe(logBtn, { attributes: true, attributeFilter: ['class'] });

            chart.__tradigyScaleModeBound = true;
        })();

        // ============================================================
        // TRADIGY V2 MOUSE WHEEL CONTROLS
        // Wheel        = existing horizontal scroll
        // Ctrl + Wheel = horizontal zoom around chart center
        // Alt + Wheel  = vertical price-scale zoom
        // Manual wheel zoom overrides A/L auto-scale and scale-lock
        // ============================================================
        (function setupTradigyWheelControls() {
            const parent = document.getElementById('fcs_chartparent');

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function disableManualScaleLocks() {
                const engine = chart && chart.engine;
                if (!engine) return;

                if (engine.options) {
                    engine.options.autoScale = false;
                    engine.options.lockScale = false;
                    engine.options.priceScaleLock = false;
                    engine.options.scaleLock = false;
                }

                const ui = engine.uiManager;
                if (ui) {
                    if ('autoScale' in ui) ui.autoScale = false;
                    if ('lockScale' in ui) ui.lockScale = false;
                    if ('priceScaleLock' in ui) ui.priceScaleLock = false;
                    if ('scaleLock' in ui) ui.scaleLock = false;
                }
            }

            function horizontalZoom(factor) {
                const engine = chart && chart.engine;
                if (!engine) return;

                const oldWidth = Number(engine.candleWidth) || 8;
                const spacing = Number(engine.candleSpacing) || 0;
                const newWidth = clamp(oldWidth * factor, 1, 80);
                if (Math.abs(newWidth - oldWidth) < 0.0001) return;

                const priceAxisWidth = Number(engine.priceAxisWidth) || 0;
                const chartWidth = Math.max(
                    1,
                    Number(engine.width) || parent.clientWidth || 1
                );
                const viewportWidth = Math.max(1, chartWidth - priceAxisWidth);
                const centerX = viewportWidth / 2;

                const oldStep = oldWidth + spacing;
                const newStep = newWidth + spacing;

                // Keep the candle at the horizontal screen center fixed.
                const centerIndex =
                    (Number(engine.scrollOffset) || 0) + centerX / oldStep;

                engine.candleWidth = newWidth;
                engine.scrollOffset = centerIndex - centerX / newStep;

                if (typeof engine.calculateVisibleRange === 'function') {
                    engine.calculateVisibleRange();
                }
                if (typeof engine.render === 'function') {
                    engine.render();
                }
            }

            function deactivateScaleModes() {
                const chartInstance = chart;
                if (!chartInstance) return;

                // Use the chart's own toggle methods so state, UI manager,
                // and A/L button state remain synchronized.
                if (chartInstance.autoScale && typeof chartInstance.toggleAutoScale === 'function') {
                    chartInstance.toggleAutoScale();
                }
                // FCS keeps log-scale state on the chart instance; its
                // obfuscated toggle method is not a stable public method.
                chartInstance.logScale = false;

                if (typeof chartInstance.updatePriceScaleButtons === 'function') {
                    chartInstance.updatePriceScaleButtons();
                }
            }

            function deactivateAutoScaleFromPriceScaleWheel(event) {
                const engine = chart && chart.engine;
                const canvas = engine && engine.overlayCanvas;
                if (!engine || !canvas) return false;

                const rect = canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const priceAxisWidth = Number(engine.priceAxisWidth) || 0;

                // The FCS price scale is rendered at the right edge of the
                // overlay canvas; use geometry instead of DOM selectors.
                const onPriceScale = priceAxisWidth > 0 && x >= rect.width - priceAxisWidth;
                if (onPriceScale) {
                    deactivateScaleModes();
                }

                return onPriceScale;
            }



            function verticalZoom(factor) {
                const engine = chart && chart.engine;
                if (!engine) return;

                scaleModesLockedInactive = true;
                deactivateScaleModes();
                const autoBtn = chart && chart.priceScaleAutoBtn;
                const logBtn = chart && chart.priceScaleLogBtn;
                if (autoBtn) {
                    autoBtn.classList.remove('active');
                    autoBtn.setAttribute('aria-pressed', 'false');
                }
                if (logBtn) {
                    logBtn.classList.remove('active');
                    logBtn.setAttribute('aria-pressed', 'false');
                }

                const range = engine.priceRange;
                if (!range) return;

                const min = Number(range.min);
                const max = Number(range.max);
                if (!Number.isFinite(min) || !Number.isFinite(max) || max <= min) {
                    return;
                }

                const center = (min + max) / 2;
                const half = (max - min) / 2;
                const nextHalf = clamp(half * factor, Number.EPSILON, half * 100);

                range.min = center - nextHalf;
                range.max = center + nextHalf;

                if (typeof engine.render === 'function') {
                    engine.render();
                }
            }

            function onWheel(event) {
                // Normal wheel over the price scale starts manual scaling.
                // Normal wheel over the chart remains the existing scroll.
                if (!event.ctrlKey && !event.altKey) {
                    deactivateAutoScaleFromPriceScaleWheel(event);
                    return;
                }

                // Ctrl/Alt wheel is owned by Tradigy.
                if ((event.ctrlKey ? 1 : 0) + (event.altKey ? 1 : 0) !== 1) {
                    return;
                }

                event.preventDefault();
                event.stopPropagation();

                // Price-scale wheel deactivates A/L immediately; chart wheel does not.
                deactivateAutoScaleFromPriceScaleWheel(event);

                if (event.ctrlKey) {
                    // DO NOT CHANGE CTRL-WHEEL BEHAVIOR.
                    const factor = event.deltaY < 0 ? 1.15 : (1 / 1.15);
                    horizontalZoom(factor);
                } else {
                    // Alt + Wheel: up = zoom in, down = zoom out.
                    const factor = event.deltaY < 0 ? (1 / 1.15) : 1.15;
                    verticalZoom(factor);
                }
            }

            function bindWheel() {
                if (!parent || parent.dataset.tradigyWheelBound === '1') return true;

                parent.addEventListener('wheel', onWheel, {
                    passive: false,
                    capture: true
                });
                parent.dataset.tradigyWheelBound = '1';

                return true;
            }

            if (!bindWheel()) {
                const observer = new MutationObserver(() => {
                    if (bindWheel()) observer.disconnect();
                });
                observer.observe(document.documentElement, {
                    childList: true,
                    subtree: true
                });
                setTimeout(() => observer.disconnect(), 10000);
            }


        })();

        console.log('Chart initialized:', chart);

        // Debug info after data loads
        setTimeout(() => {

            console.log('Socket status:', chart.engine.socketManager?.getConnectionStatus());
            console.log('Theme:', chart.engine.themeManager?.currentTheme);
        }, 2000);
